<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Administración · Pastelería San Pedro</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3B1C07">
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=5">
<link rel="stylesheet" href="app.css?v=5">
<link rel="stylesheet" href="admin.css?v=5">
</head>
<body class="app admin">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5h-5v5H4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12.1a1 1 0 0 1-1 .9H7.2a1 1 0 0 1-1-.9L5 8Z M9 8V6.5a3 3 0 0 1 6 0V8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4.5" y="7.5" width="15" height="11" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 4v3.5M9 12.5h.01M15 12.5h.01M9.5 15.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16M8.5 16v-5M12.5 16V7.5M16.5 16v-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-mega" viewBox="0 0 24 24"><path d="M4 10v4h3l7 4V6L7 10H4Zm14-1.5a4 4 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 19c.9-3 3.2-4.5 6-4.5s5.1 1.5 6 4.5M15.5 5.8a3.3 3.3 0 0 1 0 6.4M17.5 14.8c1.7.6 2.9 2 3.5 4.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 18.5V6.5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H8.5L5 18.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3Z"/></symbol>
  <symbol id="i-ig" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/></symbol>
  <symbol id="i-fb" viewBox="0 0 24 24"><path fill="currentColor" d="M13.5 21v-7.5H16l.4-3h-2.9V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4a21 21 0 0 0-2.3-.1c-2.3 0-3.9 1.4-3.9 4v2.2H8v3h2.4V21h3.1Z"/></symbol>
  <symbol id="i-web" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 12h17M12 3.5c2.4 2.4 3.5 5.2 3.5 8.5s-1.1 6.1-3.5 8.5c-2.4-2.4-3.5-5.2-3.5-8.5S9.6 5.9 12 3.5Z" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.5 3.5h3l1.5 4-2 1.5a10 10 0 0 0 6 6l1.5-2 4 1.5v3a2 2 0 0 1-2 2A15.5 15.5 0 0 1 4.5 5.5a2 2 0 0 1 2-2Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header class="app-top">
  <a class="brand" href="index.html"><img class="brand__logo" src="img/logo-128.webp" alt="San Pedro" width="44" height="44"><span class="brand__text"><b>San Pedro</b><small>Administración</small></span></a>
  <label class="app-search"><svg><use href="#i-search"/></svg><input type="search" placeholder="Buscar pedido o cliente" data-search></label>
  <div class="app-top__right">
    <button class="btn btn--solid btn--sm" type="button" data-new-order><svg><use href="#i-plus"/></svg><span class="hide-sm">Pedido telefónico</span></button>
    <div class="bell">
      <button class="icon-btn" type="button" data-bell aria-label="Notificaciones" aria-expanded="false"><svg><use href="#i-bell"/></svg><span class="bag-count" data-bell-count hidden>0</span></button>
      <div class="notif" data-notif hidden>
        <div class="notif__head"><b>Notificaciones</b><button class="link link--sm" type="button" data-notif-read>Marcar como leídas</button></div>
        <div class="notif__list" data-notif-list></div>
      </div>
    </div>
    <span class="avatar" title="Administrador demo">SP</span>
  </div>
</header>

<div class="app-shell">
  <nav class="side" aria-label="Administración">
    <a href="#resumen" data-view-link="resumen"><svg><use href="#i-home"/></svg>Resumen</a>
    <a href="#pedidos" data-view-link="pedidos"><svg><use href="#i-bag"/></svg>Pedidos</a>
    <a href="#agente" data-view-link="agente"><svg><use href="#i-bot"/></svg>Revisión del agente<span class="count" data-agent-count>0</span></a>
    <a href="#capacidad" data-view-link="capacidad"><svg><use href="#i-cal"/></svg>Cupos</a>
    <p class="side__label">Crecer</p>
    <a href="#reportes" data-view-link="reportes"><svg><use href="#i-chart"/></svg>Reportería</a>
    <a href="#campanas" data-view-link="campanas"><svg><use href="#i-mega"/></svg>Campañas</a>
    <a href="#clientes" data-view-link="clientes"><svg><use href="#i-users"/></svg>Clientes y puntos</a>
    <a href="#canales" data-view-link="canales"><svg><use href="#i-chat"/></svg>Chatbot y canales</a>
    <p class="side__foot">Datos de ejemplo para mostrar cómo funcionaría.<br><a href="index.html" style="display:inline;padding:4px 0">← Ver la tienda</a></p>
  </nav>

  <main class="main">
    <section class="view" id="v-resumen"></section>
    <section class="view" id="v-pedidos"></section>
    <section class="view" id="v-agente"></section>
    <section class="view" id="v-capacidad"></section>
    <section class="view" id="v-reportes"></section>
    <section class="view" id="v-campanas"></section>
    <section class="view" id="v-clientes"></section>
    <section class="view" id="v-canales"></section>
  </main>
</div>

<!-- Modal genérico (pedido telefónico, detalle, editar día) -->
<div class="modal" id="modal" role="dialog" aria-modal="true" hidden>
  <div class="modal__box modal__box--wide">
    <button class="modal__x" type="button" data-close-modal aria-label="Cerrar">×</button>
    <div data-modal-body></div>
  </div>
</div>

<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<p class="demo-tag">Propuesta de diseño · versión de prueba por José Farías</p>
<script src="data.js?v=5"></script>
<script src="admin.js?v=5"></script>
</body>
</html>
